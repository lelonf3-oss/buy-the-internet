<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ad Editor – BUY THE INTERNET</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main id="app">
    <h1>Ad Editor</h1>
    <p class="tagline">Design your 24-hour takeover.</p>

    <label>Company Name <input id="companyName" placeholder="Acme Inc."></label>
    <label>Logo URL <input id="logoUrl" placeholder="https://..."></label>
    <label>Headline <input id="headline" placeholder="Your big headline"></label>
    <label>Description <textarea id="description" placeholder="Describe your brand..."></textarea></label>
    <label>Background Image URL <input id="bgUrl" placeholder="https://..."></label>
    <label>Primary Color <input type="color" id="primaryColor" value="#e8ff00"></label>
    <label>Button Text <input id="btnText" placeholder="Learn More"></label>
    <label>Button URL <input id="btnUrl" placeholder="https://..."></label>

    <button id="saveBtn">Save Ad</button>

    <h2>Live Preview</h2>
    <iframe id="preview" style="width:100%;height:500px;border:1px solid #333;border-radius:12px;background:#000;"></iframe>
  </main>

  <script>
    const token = new URLSearchParams(location.search).get('token');

    function getData() {
      return {
        companyName: document.getElementById('companyName').value,
        logoUrl: document.getElementById('logoUrl').value,
        headline: document.getElementById('headline').value,
        description: document.getElementById('description').value,
        bgUrl: document.getElementById('bgUrl').value,
        primaryColor: document.getElementById('primaryColor').value,
        btnText: document.getElementById('btnText').value,
        btnUrl: document.getElementById('btnUrl').value,
      };
    }

    function updatePreview() {
      const d = getData();
      const html = `
        <html><body style="margin:0;font-family:sans-serif;background:${d.bgUrl ? `url('${d.bgUrl}') center/cover` : '#000'};color:#fff;">
          <div style="max-width:700px;margin:0 auto;padding:4rem 2rem;text-align:center;">
            ${d.logoUrl ? `<img src="${d.logoUrl}" style="max-height:60px;margin-bottom:2rem;">` : ''}
            <h1 style="font-size:3rem;margin:0 0 1rem;">${d.headline || 'Your Headline'}</h1>
            <p style="font-size:1.2rem;color:#ccc;margin-bottom:2rem;">${d.description || ''}</p>
            ${d.btnText ? `<a href="${d.btnUrl || '#'}" style="display:inline-block;padding:1rem 2rem;background:${d.primaryColor};color:#000;font-weight:700;text-decoration:none;border-radius:8px;">${d.btnText}</a>` : ''}
          </div>
        </body></html>`;
      document.getElementById('preview').srcdoc = html;
    }

    document.querySelectorAll('input, textarea').forEach(el => {
      el.addEventListener('input', updatePreview);
    });

    document.getElementById('saveBtn').addEventListener('click', async () => {
      const data = getData();
      for (const key of ['logoUrl', 'bgUrl', 'btnUrl']) {
        if (data[key] && !/^https:\/\//i.test(data[key])) {
          alert(`${key} must be a valid https:// URL`);
          return;
        }
      }
      const res = await fetch('/api/editor', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, adData: data }),
      });
      if (res.ok) alert('Ad saved!');
      else alert('Save failed – invalid token?');
    });

    updatePreview();
  </script>
</body>
</html>
