<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ad Editor — BUY THE INTERNET</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050505;
      --panel: #0a0a0a;
      --border: #222;
      --text: #fff;
      --muted: #888;
      --accent: #ccff00;
      --font: 'Inter', sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); height: 100vh; display: flex; overflow: hidden; }

    /* Left Side: Form */
    .sidebar { width: 420px; background: var(--bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; height: 100%; }
    .sidebar-header { padding: 24px; border-bottom: 1px solid var(--border); }
    .sidebar-header h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 4px; }
    .sidebar-header p { font-size: 13px; color: var(--muted); }
    
    .form-scroll { flex: 1; overflow-y: auto; padding: 24px; }
    .form-scroll::-webkit-scrollbar { width: 6px; }
    .form-scroll::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

    .section-title { font-family: var(--mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin: 24px 0 12px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .section-title:first-child { margin-top: 0; }

    .input-group { margin-bottom: 16px; }
    .input-group label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .input-group input, .input-group textarea { width: 100%; background: var(--panel); border: 1px solid var(--border); padding: 12px; color: var(--text); font-family: var(--font); font-size: 14px; border-radius: 4px; outline: none; transition: border 0.2s; }
    .input-group input:focus, .input-group textarea:focus { border-color: var(--accent); }
    .input-group textarea { resize: vertical; min-height: 80px; }
    .color-picker { width: 100%; height: 40px; background: var(--panel); border: 1px solid var(--border); cursor: pointer; padding: 0; }

    .btn-save { width: 100%; background: var(--accent); color: #000; border: none; padding: 16px; font-size: 15px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; transition: opacity 0.2s; margin-top: 24px; border-radius: 4px; }
    .btn-save:hover { opacity: 0.8; }
    .status { text-align: center; font-size: 13px; margin-top: 12px; font-family: var(--mono); }

    /* Right Side: Preview */
    .preview-area { flex: 1; background: #111; display: flex; flex-direction: column; padding: 24px; }
    .browser-frame { flex: 1; background: #000; border-radius: 12px; border: 1px solid #333; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
    .browser-bar { height: 40px; background: #1a1a1a; display: flex; align-items: center; padding: 0 16px; gap: 8px; border-bottom: 1px solid #333; }
    .browser-dot { width: 10px; height: 10px; border-radius: 50%; background: #444; }
    .browser-url { margin-left: 16px; background: #000; padding: 4px 12px; border-radius: 4px; font-family: var(--mono); font-size: 11px; color: #666; flex: 1; }
    
    iframe { flex: 1; width: 100%; height: 100%; border: none; background: #000; }

    @media (max-width: 900px) {
      body { flex-direction: column; height: auto; overflow: auto; }
      .sidebar { width: 100%; height: auto; border-right: none; border-bottom: 1px solid var(--border); }
      .preview-area { height: 600px; padding: 16px; }
    }
  </style>
</head>
<body>

  <!-- LINKE SEITE: FORMULAR -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h1>Ad Editor</h1>
      <p>Design your 24-hour takeover.</p>
    </div>
    
    <div class="form-scroll">
      <div class="section-title">Brand</div>
      <div class="input-group">
        <label>Company Name</label>
        <input id="companyName" placeholder="e.g. Acme Inc.">
      </div>
      <div class="input-group">
        <label>Logo URL (https://...)</label>
        <input id="logoUrl" placeholder="https://i.ibb.co/...">
      </div>

      <div class="section-title">Content</div>
      <div class="input-group">
        <label>Headline</label>
        <input id="headline" placeholder="Your big headline">
      </div>
      <div class="input-group">
        <label>Description</label>
        <textarea id="description" placeholder="Describe your brand..."></textarea>
      </div>

      <div class="section-title">Design</div>
      <div class="input-group">
        <label>Background Image URL (https://...)</label>
        <input id="bgUrl" placeholder="https://...">
      </div>
      <div class="input-group">
        <label>Primary Color</label>
        <input type="color" id="primaryColor" class="color-picker" value="#ccff00">
      </div>

      <div class="section-title">Call to Action</div>
      <div class="input-group">
        <label>Button Text</label>
        <input id="btnText" placeholder="e.g. Learn More">
      </div>
      <div class="input-group">
        <label>Button URL (https://...)</label>
        <input id="btnUrl" placeholder="https://...">
      </div>

      <button id="saveBtn" class="btn-save">Save & Publish</button>
      <div id="status" class="status"></div>
    </div>
  </div>

  <!-- RECHTE SEITE: LIVE VORSCHAU -->
  <div class="preview-area">
    <div class="browser-frame">
      <div class="browser-bar">
        <div class="browser-dot" style="background: #ff5f56;"></div>
        <div class="browser-dot" style="background: #ffbd2e;"></div>
        <div class="browser-dot" style="background: #27c93f;"></div>
        <div class="browser-url" id="previewUrl">your-brand.com</div>
      </div>
      <iframe id="preview"></iframe>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const token = new URLSearchParams(location.search).get('token');

    function getData() {
      return {
        companyName: $('companyName').value,
        logoUrl: $('logoUrl').value,
        headline: $('headline').value,
        description: $('description').value,
        bgUrl: $('bgUrl').value,
        primaryColor: $('primaryColor').value,
        btnText: $('btnText').value,
        btnUrl: $('btnUrl').value,
      };
    }

    function renderPreview() {
      const d = getData();
      $('previewUrl').textContent = (d.companyName || 'your-brand').toLowerCase().replace(/\s+/g, '-') + '.com';
      
      const bgStyle = d.bgUrl 
        ? `background: url('${d.bgUrl}') center/cover;` 
        : `background: #050505;`;

      const html = `
        <!DOCTYPE html><html><head>
        <style>
          @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
          * { margin: 0; padding: 0; box-sizing: border-box; }
          body { font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; color: #fff; ${bgStyle} }
          .wrap { max-width: 800px; }
          .logo { max-height: 80px; margin-bottom: 32px; }
          .company { color: ${d.primaryColor}; letter-spacing: 0.1em; text-transform: uppercase; font-weight: bold; margin-bottom: 16px; font-size: 14px; }
          h1 { font-size: clamp(2.5rem, 6vw, 4rem); margin: 0 0 24px; line-height: 1.1; font-weight: 900; letter-spacing: -0.03em; }
          p { font-size: 1.25rem; color: #aaa; margin-bottom: 48px; line-height: 1.6; }
          a { display: inline-block; padding: 20px 40px; background: ${d.primaryColor}; color: #000; text-decoration: none; font-weight: 800; font-size: 1.1rem; transition: transform 0.2s; }
        </style></head><body>
          <div class="wrap">
            ${d.logoUrl ? `<img class="logo" src="${d.logoUrl}">` : ''}
            ${d.companyName ? `<div class="company">${d.companyName}</div>` : ''}
            <h1>${d.headline || 'Your Headline'}</h1>
            <p>${d.description || 'Your description goes here.'}</p>
            ${d.btnText ? `<a href="${d.btnUrl || '#'}" target="_blank">${d.btnText}</a>` : ''}
          </div>
        </body></html>
      `;
      $('preview').srcdoc = html;
    }

    document.querySelectorAll('input, textarea').forEach(el => {
      el.addEventListener('input', renderPreview);
    });

    $('saveBtn').addEventListener('click', async () => {
      const data = getData();
      const status = $('status');
      status.textContent = ''; status.className = 'status';

      if (!token) {
        status.textContent = 'Demo Mode: Data saved locally only.';
        status.style.color = 'var(--accent)';
        localStorage.setItem('bti_ad_data', JSON.stringify(data));
        return;
      }

      const btn = $('saveBtn'); btn.disabled = true; btn.textContent = 'Saving...';
      try {
        const res = await fetch('/api/editor', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, adData: data }),
        });
        if (res.ok) {
          status.textContent = 'Successfully saved. Your takeover is ready.';
          status.style.color = 'var(--accent)';
          btn.textContent = 'Saved!';
        } else {
          status.textContent = 'Error: Invalid token or server issue.';
          status.style.color = '#ff4444';
          btn.textContent = 'Save & Publish';
        }
      } catch (e) {
        status.textContent = 'Network error.';
        status.style.color = '#ff4444';
        btn.textContent = 'Save & Publish';
      } finally { btn.disabled = false; }
    });

    // Load saved demo data
    try {
      const saved = JSON.parse(localStorage.getItem('bti_ad_data') || 'null');
      if (saved) Object.keys(saved).forEach(k => { if ($(k)) $(k).value = saved[k]; });
    } catch (e) {}

    renderPreview();
  </script>
</body>
</html>
