<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUY THE INTERNET</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --surface: #0a0a0a;
      --border: #222222;
      --text: #ffffff;
      --muted: #888888;
      --accent: #ccff00; /* Knalliges Neon-Grün */
      --accent-text: #000000;
      --font: 'Inter', sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; line-height: 1.4; }
    
    /* Layout */
    .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
    header { padding: 32px 0; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
    .logo { font-size: 20px; font-weight: 900; letter-spacing: -0.05em; display: flex; align-items: center; gap: 8px; }
    .logo span { color: var(--accent); }
    .status { font-family: var(--mono); font-size: 12px; color: var(--accent); display: flex; align-items: center; gap: 8px; text-transform: uppercase; letter-spacing: 0.1em; }
    .status-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

    /* Hero */
    .hero { padding: 80px 0; text-align: center; border-bottom: 1px solid var(--border); }
    h1 { font-size: clamp(3rem, 10vw, 7rem); font-weight: 900; line-height: 0.9; letter-spacing: -0.05em; margin-bottom: 24px; }
    h1 span { display: block; }
    .subtitle { font-size: clamp(1rem, 2vw, 1.25rem); color: var(--muted); max-width: 600px; margin: 0 auto; }

    /* Main Grid */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); border-bottom: 1px solid var(--border); }
    .box { background: var(--bg); padding: 48px; display: flex; flex-direction: column; justify-content: center; }
    .label { font-family: var(--mono); font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px; }
    .value { font-size: clamp(2.5rem, 6vw, 4rem); font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
    .value.mono { font-family: var(--mono); font-weight: 600; }
    .value.accent { color: var(--accent); }
    
    /* Bid Form */
    .bid-section { padding: 48px; border-bottom: 1px solid var(--border); text-align: center; }
    .bid-form { display: flex; gap: 16px; max-width: 600px; margin: 24px auto 0; }
    .bid-form input { flex: 1; background: var(--surface); border: 1px solid var(--border); padding: 20px; color: white; font-family: var(--mono); font-size: 16px; outline: none; transition: border 0.2s; }
    .bid-form input:focus { border-color: var(--accent); }
    .bid-form button { background: var(--accent); color: var(--accent-text); border: none; padding: 0 32px; font-weight: 800; font-size: 16px; cursor: pointer; transition: opacity 0.2s; text-transform: uppercase; letter-spacing: 0.05em; }
    .bid-form button:hover { opacity: 0.8; }
    .feedback { margin-top: 16px; font-size: 14px; font-family: var(--mono); }
    .feedback.error { color: #ff4444; }
    .feedback.success { color: var(--accent); }

    /* Feed */
    .feed-section { padding: 48px; }
    .feed-list { display: flex; flex-direction: column; gap: 16px; margin-top: 24px; }
    .feed-item { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 14px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
    .feed-item:last-child { border-bottom: none; padding-bottom: 0; }
    .feed-item .email { color: var(--muted); }
    .feed-item .amount { font-weight: 600; }

    @media (max-width: 768px) {
      .grid { grid-template-columns: 1fr; }
      .bid-form { flex-direction: column; }
      .bid-form button { padding: 20px; }
      .box, .bid-section, .feed-section { padding: 32px 24px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo">BUY THE INTERNET<span>.</span></div>
      <div class="status"><div class="status-dot"></div> Live Auction</div>
    </header>
  </div>

  <!-- DIESER BEREICH WIRD BEI GEWINN DURCH WERBUNG ERSETZT -->
  <div id="auctionView">
    <div class="hero container">
      <h1><span>BUY THE</span><span>INTERNET<span style="color: var(--accent)">.</span></span></h1>
      <p class="subtitle">The highest bidder takes over this entire homepage for a full day. When the clock hits zero, it's gone.</p>
    </div>

    <div class="container">
      <div class="grid">
        <div class="box" style="border-right: 1px solid var(--border);">
          <div class="label">Current Highest Bid</div>
          <div class="value accent" id="highestBid">€0.00</div>
          <div class="label" style="margin-top: 24px;">Highest Bidder</div>
          <div class="value" id="highestBidder" style="font-size: 1.5rem;">—</div>
        </div>
        <div class="box">
          <div class="label">Time Remaining</div>
          <div class="value mono" id="countdown">00:00:00</div>
          <div class="label" style="margin-top: 24px;">Minimum Next Bid</div>
          <div class="value" id="nextMinBid" style="font-size: 2rem;">€0.00</div>
        </div>
      </div>

      <div class="bid-section">
        <div class="label">Place your bid</div>
        <form id="bidForm" class="bid-form">
          <input type="email" id="email" placeholder="your@email.com" required>
          <input type="number" id="amount" placeholder="Amount in €" step="0.01" required>
          <button type="submit">Bid Now</button>
        </form>
        <div id="bidFeedback" class="feedback"></div>
      </div>

      <div class="feed-section">
        <div class="label">Live Bid Feed</div>
        <div class="feed-list" id="bidList">
          <div class="feed-item"><span class="email">No bids yet</span><span class="amount">—</span></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const fmt = (cents) => new Intl.NumberFormat('en-IE', { style: 'currency', currency: 'EUR' }).format((cents || 0) / 100);
    const maskEmail = (e) => {
      if (!e || !e.includes('@')) return e || '—';
      const [u, d] = e.split('@');
      return (u ? u.slice(0, 2) + '***' : '***') + '@' + d;
    };

    let countdownInterval = null;
    function renderCountdown(endTime) {
      if (countdownInterval) clearInterval(countdownInterval);
      const el = $('countdown');
      const tick = () => {
        const left = endTime - Math.floor(Date.now() / 1000);
        if (left <= 0) { el.textContent = '00:00:00'; return; }
        const h = Math.floor(left / 3600);
        const m = Math.floor((left % 3600) / 60);
        const s = left % 60;
        el.textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      };
      tick();
      countdownInterval = setInterval(tick, 1000);
    }

    async function loadAuction() {
      try {
        const res = await fetch('/api/auction');
        if (!res.ok) return;
        const data = await res.json();

        // WERBUNG ANZEIGEN (Wenn Gewinner bezahlt hat)
        if (data.activeAd) {
          const ad = data.activeAd;
          document.getElementById('auctionView').innerHTML = `
            <div style="min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; background:${ad.bgUrl ? `url('${ad.bgUrl}') center/cover` : '#000'};">
              <div style="max-width:800px;">
                ${ad.logoUrl ? `<img src="${ad.logoUrl}" style="max-height:80px; margin-bottom:32px;">` : ''}
                ${ad.companyName ? `<p style="color:${ad.primaryColor || '#ccff00'}; letter-spacing:0.1em; text-transform:uppercase; font-weight:bold; margin-bottom:16px;">${ad.companyName}</p>` : ''}
                <h1 style="font-size:clamp(3rem, 8vw, 5rem); margin:0 0 24px; line-height:1.1; font-weight:900;">${ad.headline || 'Welcome'}</h1>
                <p style="font-size:1.25rem; color:#aaa; margin-bottom:48px; line-height:1.6;">${ad.description || ''}</p>
                ${ad.btnText ? `<a href="${ad.btnUrl || '#'}" style="display:inline-block; padding:20px 40px; background:${ad.primaryColor || '#ccff00'}; color:#000; text-decoration:none; font-weight:800; font-size:1.1rem; transition:transform 0.2s;">${ad.btnText}</a>` : ''}
              </div>
            </div>`;
          if (countdownInterval) clearInterval(countdownInterval);
          return;
        }

        // AUKTION ANZEIGEN
        $('highestBid').textContent = data.highestBid ? fmt(data.highestBid.amount) : fmt(0);
        $('highestBidder').textContent = data.highestBid ? maskEmail(data.highestBid.email) : '—';
        $('nextMinBid').textContent = fmt(data.nextMinBid);
        renderCountdown(data.auction.endTime);

        const list = $('bidList');
        if (!data.recentBids || data.recentBids.length === 0) {
          list.innerHTML = '<div class="feed-item"><span class="email">No bids yet</span><span class="amount">—</span></div>';
        } else {
          list.innerHTML = data.recentBids.map(b => `
            <div class="feed-item">
              <span class="email">${maskEmail(b.email)}</span>
              <span class="amount">${fmt(b.amount)}</span>
            </div>`).join('');
        }
      } catch (e) { console.error(e); }
    }

    $('bidForm').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const fb = $('bidFeedback');
      fb.textContent = ''; fb.className = 'feedback';
      const email = $('email').value.trim();
      const eur = parseFloat($('amount').value);
      if (isNaN(eur) || eur <= 0) { fb.textContent = 'Enter a valid amount.'; fb.classList.add('error'); return; }

      const btn = ev.target.querySelector('button');
      btn.disabled = true;
      try {
        const aRes = await fetch('/api/auction');
        const aData = await aRes.json();
        const res = await fetch('/api/bid', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ auctionId: aData.auction.id, amount: Math.round(eur*100), email }),
        });
        const result = await res.json();
        if (result.success) {
          fb.textContent = 'Bid placed successfully!';
          fb.classList.add('success');
          $('bidForm').reset();
          loadAuction();
        } else {
          fb.textContent = result.error || 'Bid failed.';
          fb.classList.add('error');
        }
      } catch (e) {
        fb.textContent = 'Network error.';
        fb.classList.add('error');
      } finally { btn.disabled = false; }
    });

    loadAuction();
    setInterval(loadAuction, 15000);
  </script>
</body>
</html>
